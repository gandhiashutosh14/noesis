[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noesis"
version = "0.1.0"
description = "A self-improving agent framework: multi-judge jury, gated step-level rewards, and an inspectable SQLite policy that updates across runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Gandhi" }]
keywords = ["agents", "llm", "reinforcement-learning", "self-improvement", "rlaif", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
noesis = "noesis.cli.main:main"

[tool.setuptools.packages.find]
include = ["noesis*"]

[tool.setuptools.package-data]
noesis = ["config/*.yaml", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["noesis/tests"]
